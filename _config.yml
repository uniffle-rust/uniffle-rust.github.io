title: Riffle
description: A high-performance, Apache Uniffle-compatible shuffle server written in Rust.
theme: just-the-docs
color_scheme: riffle

url: https://uniffle-rust.github.io
baseurl: ""
repository: zuston/riffle

source: docs
destination: _site

# Set this directly for a non-Actions deployment, or provide
# CLOUDFLARE_WEB_ANALYTICS_TOKEN in the build environment.
cloudflare_web_analytics_token: ""

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false
  focus_shortcut_key: "k"

heading_anchors: true
nav_enabled: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "GitHub":
    - "https://github.com/zuston/riffle"
aux_links_new_tab: true

nav_external_links:
  - title: Apache Uniffle
    url: https://github.com/apache/uniffle
    hide_icon: false

callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: yellow
  danger:
    title: Danger
    color: red

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
