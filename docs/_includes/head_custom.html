{% assign analytics_token = site.cloudflare_web_analytics_token | default: "" | strip %}
{% if jekyll.environment == "production" and analytics_token != "" %}
  <script
    defer
    src="https://static.cloudflareinsights.com/beacon.min.js"
    data-cf-beacon='{"token":"{{ analytics_token | escape }}","spa":false}'
  ></script>
{% endif %}
